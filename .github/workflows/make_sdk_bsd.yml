name: Make SDK (BSD)
run-name: Make SDK ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "AOSP source tag (android-* or platform-tools-*)"
        required: true
        default: "android-17.0.0_r1"
      only:
        description: "Only these targets (JSON array), default all"
        required: false
        type: string

permissions:
  contents: write
  packages: read

jobs:
  make:
    uses: ./.github/workflows/make-sdk.yml
    secrets: inherit
    with:
      platform: bsd
      tag: ${{ inputs.tag }}
      only: ${{ inputs.only }}
      # powerpc-netbsd-eabi, powerpc-freebsd-eabihf (removed from .libc)
      # mips64el-openbsd-none, x86-freebsd-none (removed from zig 0.18 .libc)
      targets: >-
        ["aarch64-freebsd-none", "aarch64-netbsd-none",
         "aarch64-openbsd-none", "aarch64be-netbsd-none", "arm-freebsd-none",
         "arm-netbsd-none", "arm-netbsd-sf", "arm-openbsd-sf",
         "armeb-netbsd-none", "armeb-netbsd-sf", "mips-netbsd-none", "mips-netbsd-sf", "mips64-netbsd-n32sf",
         "mips64-netbsd-sf", "mips64-openbsd-none", "mips64el-netbsd-n32sf",
         "mips64el-netbsd-sf", "mipsel-netbsd-none", "mipsel-netbsd-sf",
         "mipsf32-netbsd-none", "mipsf32el-netbsd-none",
         "powerpc-netbsd-none", "powerpc-openbsd-none",
         "powerpc64-freebsd-none", "powerpc64-openbsd-none",
         "powerpc64le-freebsd-none", "riscv32-netbsd-none",
         "riscv64-freebsd-none", "riscv64-netbsd-none",
         "riscv64-openbsd-none", "sparc-netbsd-none", "sparc64-netbsd-none",
         "sparc64-openbsd-none", "x86-netbsd-none", "x86-openbsd-none",
         "x86_64-freebsd-none", "x86_64-netbsd-none", "x86_64-openbsd-none"]
