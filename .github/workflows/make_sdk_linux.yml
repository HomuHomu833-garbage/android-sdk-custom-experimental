name: Make SDK (Linux)
run-name: Make SDK ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "AOSP source tag (android-* or platform-tools-*)"
        required: true
        default: "android-17.0.0_r1"
      only:
        description: "Only these targets (JSON array), default all"
        required: false
        type: string

permissions:
  contents: write
  packages: read

jobs:
  make:
    uses: ./.github/workflows/make-sdk.yml
    secrets: inherit
    with:
      platform: linux
      tag: ${{ inputs.tag }}
      only: ${{ inputs.only }}
      # broken: loongarch32-linux-gnu, loongarch32-linux-gnusf,
      #   mipsf32-linux-gnu, mipsf32-linux-musl, mipsf32el-linux-gnu,
      #   mipsf32el-linux-musl, sparc-linux-gnu
      targets: >-
        ["aarch64-linux-gnu", "aarch64-linux-musl", "aarch64be-linux-gnu",
         "aarch64be-linux-musl", "arm-linux-gnu", "arm-linux-gnusf",
         "arm-linux-musl", "arm-linux-muslsf", "armeb-linux-gnu",
         "armeb-linux-gnusf", "armeb-linux-musl", "armeb-linux-muslsf",
         "hexagon-linux-musl", "loongarch64-linux-gnu",
         "loongarch64-linux-gnusf", "loongarch64-linux-musl",
         "loongarch64-linux-muslf32", "loongarch64-linux-muslsf",
         "mips-linux-gnu", "mips-linux-gnusf", "mips-linux-musl",
         "mips-linux-muslsf", "mips64-linux-gnu", "mips64-linux-gnun32",
         "mips64-linux-gnusf", "mips64-linux-musl", "mips64-linux-musln32",
         "mips64-linux-muslsf", "mips64el-linux-gnu",
         "mips64el-linux-gnun32", "mips64el-linux-gnusf",
         "mips64el-linux-musl", "mips64el-linux-musln32",
         "mips64el-linux-muslsf", "mips64n8-linux-gnu",
         "mips64n8-linux-gnun32", "mips64n8-linux-gnun32sf",
         "mips64n8-linux-gnusf", "mips64n8-linux-musl",
         "mips64n8-linux-musln32", "mips64n8-linux-musln32sf",
         "mips64n8-linux-muslsf", "mips64n8el-linux-gnu",
         "mips64n8el-linux-gnun32", "mips64n8el-linux-gnun32sf",
         "mips64n8el-linux-gnusf", "mips64n8el-linux-musl",
         "mips64n8el-linux-musln32", "mips64n8el-linux-musln32sf",
         "mips64n8el-linux-muslsf", "mips64r6-linux-gnu",
         "mips64r6-linux-gnun32", "mips64r6-linux-gnun32sf",
         "mips64r6-linux-gnusf", "mips64r6-linux-musl",
         "mips64r6-linux-musln32", "mips64r6-linux-musln32sf",
         "mips64r6-linux-muslsf", "mips64r6el-linux-gnu",
         "mips64r6el-linux-gnun32", "mips64r6el-linux-gnun32sf",
         "mips64r6el-linux-gnusf", "mips64r6el-linux-musl",
         "mips64r6el-linux-musln32", "mips64r6el-linux-musln32sf",
         "mips64r6el-linux-muslsf", "mipsel-linux-gnu", "mipsel-linux-gnusf",
         "mipsel-linux-musl", "mipsel-linux-muslsf", "mipsf64-linux-gnu",
         "mipsf64-linux-musl", "mipsf64el-linux-gnu", "mipsf64el-linux-musl",
         "mipsf64n8-linux-gnu", "mipsf64n8-linux-musl",
         "mipsf64n8el-linux-gnu", "mipsf64n8el-linux-musl",
         "mipsn8-linux-gnu", "mipsn8-linux-gnusf", "mipsn8-linux-musl",
         "mipsn8-linux-muslsf", "mipsn8el-linux-gnu", "mipsn8el-linux-gnusf",
         "mipsn8el-linux-musl", "mipsn8el-linux-muslsf", "mipsr6-linux-gnu",
         "mipsr6-linux-gnusf", "mipsr6-linux-musl", "mipsr6-linux-muslsf",
         "mipsr6el-linux-gnu", "mipsr6el-linux-gnusf", "mipsr6el-linux-musl",
         "mipsr6el-linux-muslsf", "powerpc-linux-musl",
         "powerpc-linux-muslsf", "powerpc64-linux-musl",
         "powerpc64le-linux-gnu", "powerpc64le-linux-musl",
         "riscv32-linux-gnu", "riscv32-linux-gnusf", "riscv32-linux-musl",
         "riscv32-linux-muslf32", "riscv32-linux-muslsf",
         "riscv64-linux-gnu", "riscv64-linux-gnusf", "riscv64-linux-musl",
         "riscv64-linux-muslf32", "riscv64-linux-muslsf", "s390x-linux-gnu",
         "s390x-linux-musl", "sparc64-linux-gnu", "thumb-linux-musl",
