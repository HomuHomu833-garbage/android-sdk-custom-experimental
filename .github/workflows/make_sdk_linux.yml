         "mipsn8-linux-gnu", "mipsn8-linux-gnusf", "mipsn8-linux-musl",
         "mipsn8-linux-muslsf", "mipsn8el-linux-gnu", "mipsn8el-linux-gnusf",
         "mipsn8el-linux-musl", "mipsn8el-linux-muslsf", "mipsr6-linux-gnu",
         "mipsr6-linux-gnusf", "mipsr6-linux-musl", "mipsr6-linux-muslsf",
         "mipsr6el-linux-gnu", "mipsr6el-linux-gnusf", "mipsr6el-linux-musl",
         "mipsr6el-linux-muslsf", "powerpc-linux-musleabi",
         "powerpc-linux-musleabihf", "powerpc64-linux-musl",
         "powerpc64le-linux-gnu", "powerpc64le-linux-musl",
         "riscv32-linux-gnu", "riscv32-linux-gnusf", "riscv32-linux-musl",
         "riscv32-linux-muslf32", "riscv32-linux-muslsf", "riscv64-linux-gnu",
         "riscv64-linux-gnusf", "riscv64-linux-musl", "riscv64-linux-muslf32",
         "riscv64-linux-muslsf", "s390x-linux-gnu", "s390x-linux-musl",
         "sparc-linux-gnu", "sparc64-linux-gnu", "thumb-linux-musleabi",
         "thumb-linux-musleabihf", "thumbeb-linux-musleabi",
         "thumbeb-linux-musleabihf", "x86-linux-gnu", "x86-linux-musl",
         "x86_64-linux-gnu", "x86_64-linux-gnux32", "x86_64-linux-musl",
         "x86_64-linux-muslx32"]
