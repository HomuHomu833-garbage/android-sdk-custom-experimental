name: Make SDK (Linux)
run-name: Make SDK ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "AOSP source tag (android-* or platform-tools-*)"
        required: true
        default: "android-17.0.0_r1"
      only:
        description: "Only these targets (JSON array), default all"
        required: false
        type: string

permissions:
  contents: write
  packages: read

jobs:
  make:
    uses: ./.github/workflows/make-sdk.yml
    secrets: inherit
    with:
      platform: linux
      tag: ${{ inputs.tag }}
      only: ${{ inputs.only }}
      targets: >-
        ["aarch64-linux-gnu", "aarch64-linux-musl", "aarch64_be-linux-gnu",
         "aarch64_be-linux-musl", "arc-linux-gnu", "arm-linux-gnueabi",
         "arm-linux-gnueabihf", "arm-linux-musleabi", "arm-linux-musleabihf",
         "armeb-linux-gnueabi", "armeb-linux-gnueabihf",
         "armeb-linux-musleabi", "armeb-linux-musleabihf", "csky-linux-gnu",
         "csky-linux-gnusf", "hexagon-linux-musl", "loongarch32-linux-gnu",
         "loongarch32-linux-gnusf", "loongarch64-linux-gnu",
         "loongarch64-linux-gnusf", "loongarch64-linux-musl",
         "loongarch64-linux-muslf32", "loongarch64-linux-muslsf",
         "m68k-linux-gnu", "m68k-linux-musl", "mips-linux-gnueabi",
         "mips-linux-gnueabihf", "mips-linux-musleabi",
         "mips-linux-musleabihf", "mips64-linux-gnuabi64",
         "mips64-linux-gnuabin32", "mips64-linux-gnusf",
         "mips64-linux-muslabi64", "mips64-linux-muslabin32",
         "mips64-linux-muslsf", "mips64el-linux-gnuabi64",
         "mips64el-linux-gnuabin32", "mips64el-linux-gnusf",
         "mips64el-linux-muslabi64", "mips64el-linux-muslabin32",
         "mips64el-linux-muslsf", "mips64n8-linux-gnu",
         "mips64n8-linux-gnun32", "mips64n8-linux-gnun32sf",
         "mips64n8-linux-gnusf", "mips64n8-linux-musl",
         "mips64n8-linux-musln32", "mips64n8-linux-musln32sf",
         "mips64n8-linux-muslsf", "mips64n8el-linux-gnu",
         "mips64n8el-linux-gnun32", "mips64n8el-linux-gnun32sf",
         "mips64n8el-linux-gnusf", "mips64n8el-linux-musl",
         "mips64n8el-linux-musln32", "mips64n8el-linux-musln32sf",
         "mips64n8el-linux-muslsf", "mips64r6-linux-gnu",
         "mips64r6-linux-gnun32", "mips64r6-linux-gnun32sf",
         "mips64r6-linux-gnusf", "mips64r6-linux-musl",
         "mips64r6-linux-musln32", "mips64r6-linux-musln32sf",
         "mips64r6-linux-muslsf", "mips64r6el-linux-gnu",
         "mips64r6el-linux-gnun32", "mips64r6el-linux-gnun32sf",
         "mips64r6el-linux-gnusf", "mips64r6el-linux-musl",
         "mips64r6el-linux-musln32", "mips64r6el-linux-musln32sf",
         "mips64r6el-linux-muslsf", "mipsel-linux-gnueabi",
         "mipsel-linux-gnueabihf", "mipsel-linux-musleabi",
         "mipsel-linux-musleabihf", "mipsf32-linux-gnu", "mipsf32-linux-musl",
         "mipsf32el-linux-gnu", "mipsf32el-linux-musl", "mipsf64-linux-gnu",
         "mipsf64-linux-musl", "mipsf64el-linux-gnu", "mipsf64el-linux-musl",
         "mipsf64n8-linux-gnu", "mipsf64n8-linux-musl",
